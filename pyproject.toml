[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-vault-cli"
version = "1.0.0"
description = "Scoped, recoverable maintenance for nested Obsidian research vaults"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
svault = "svault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
